version: '3.8'

services:

  db:
    image: postgres:15
    container_name: task_db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  # service for springboot
  app:
    build: . # use dockerfile created in first assignment
    container_name: task_app
    ports:
      - "8080:8080"
    environment:

      DB_URL: jdbc:postgresql://db:5432/taskdb
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      - db # database will run first, this will wait